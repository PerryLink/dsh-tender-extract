<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="660" viewBox="0 0 1100 660" role="img" aria-labelledby="figTitle figDesc">
<title id="figTitle">dsh-tender-extract structure: two intake channels converge in a rule × field matrix, then issues and skipped</title>
<desc id="figDesc">The material channel (JSON or YAML extract table, column aliases resolved to canonical fields) and the rule channel (rules/tender-extract.yaml, load guard on document, number, clause, excerpt, kind and source) meet in runCheck. Its seven-row matrix states, per rule, the field read, the check kind, the evidence kind that caps severity, and this run: TE-001 is one warn difference, TE-002, TE-003, TE-005, TE-006 and TE-007 are clean, TE-004 is skipped because values[] is empty. Two exits: issues[] carries row, field, found, expected and fix; skipped[] carries the rule and its reason. There is no verdict.</desc>
